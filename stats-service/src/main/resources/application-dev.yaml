spring:
  application:
    name: stats-service
  datasource:
    url: jdbc:h2:mem:db_stats
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8089

services:
  reading-list-service:
    url: http://localhost:8084
  review-service:
    url: http://localhost:8083
  user-service:
    url: http://localhost:8081
  book-service:
    url: http://localhost:8082

eureka:
  instance:
    prefer-ip-address: true

spring:
  flyway:
    enabled: false