spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tintero_social}?sslmode=require
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:stats}
        hbm2ddl:
          create_namespaces: true

services:
  book-service:
    url: http://localhost:8082
  user-service:
    url: http://localhost:8081
  reading-list-service:
    url: http://localhost:8084
  review-service:
    url: http://localhost:8083

eureka:
  client:
    enabled: false
