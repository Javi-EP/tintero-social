spring:
  datasource:
    url: jdbc:mysql://localhost:3306/db_stats?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

services:
  book-service:
    url: http://localhost:8082
  user-service:
    url: http://localhost:8081
  reading-list-service:
    url: http://localhost:8084
  review-service:
    url: http://localhost:8083