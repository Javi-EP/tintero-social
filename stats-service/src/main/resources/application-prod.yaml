spring:
  application:
    name: stats-service
  profiles:
    active: prod
  datasource:
    url: jdbc:mysql://localhost:3306/db_stats?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8089

services:
  reading-list-service:
    url: http://localhost:8084
  review-service:
    url: http://localhost:8083
  user-service:
    url: http://localhost:8081
  book-service:
    url: http://localhost:8082