spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tintero_social}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:reviews}
        hbm2ddl:
          create_namespaces: true

jwt:
  secret: tintero-social-secret-key-muy-larga-para-que-sea-segura-2026
  expiration: 86400000

logging:
  level:
    root: INFO
    cl.javiep.userservice: INFO
