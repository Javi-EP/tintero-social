  # ===================== EUREKA SERVER =====================

  eureka-server:
    build:
      context: ./eureka-server
    container_name: tintero-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod

  # ===================== MICROSERVICIOS =====================

  user-service:
    build:
      context: ./user-service
    container_name: tintero-user-service
    restart: unless-stopped
    depends_on:
      mysql-users:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql-users
      DB_PORT: 3306
      DB_NAME: db_users
      DB_USER: tintero
      DB_PASSWORD: tintero123
      EUREKA_URI: http://eureka-server:8761/eureka/
    ports:
      - "8081:8081"

