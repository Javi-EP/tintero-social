services:

  # ===================== BASES DE DATOS =====================

  mysql-users:
    image: mysql:8.4
    container_name: tintero-mysql-users
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_users
      MYSQL_USER: tintero
      MYSQL_PASSWORD: tintero123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql_users_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-books:
    image: mysql:8.4
