      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URI: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - user-service
      - book-service
      - review-service
      - reading-list-service
      - social-service
      - recommendation-service
      - notification-service
      - search-service
      - stats-service
      - audit-service

