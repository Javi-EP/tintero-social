spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tintero_social}?sslmode=require
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:social}
        hbm2ddl:
          create_namespaces: true

jwt:
  secret: tintero-social-secret-key-muy-larga-para-que-sea-segura-2026
  expiration: 86400000

services:
  user-service:
    url: http://localhost:8081
  review-service:
    url: http://localhost:8083
  reading-list-service:
    url: http://localhost:8084

logging:
  level:
    root: INFO
    cl.javiep.userservice: INFO

eureka:
  client:
    enabled: false

spring:
  flyway:
    enabled: false
