spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect


jwt:
  secret: tintero-social-secret-key-muy-larga-para-que-sea-segura-2026
  expiration: 86400000

services:
  user-service:
    url: http://user-service:8081
  review-service:
    url: http://review-service:8083
  reading-list-service:
    url: http://reading-list-service:8084

logging:
  level:
    root: INFO
    cl.javiep.userservice: INFO