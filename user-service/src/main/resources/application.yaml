spring:
  application:
    name: user-service
  profiles:
    active: prod

server:
  port: 8081

logging:
  level:
    root: INFO
    cl.javiep.userservice: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%-5level] %logger{0} - %msg%n"
  file:
    name: logs/users.log

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}